name: Schema smoke

on:
  pull_request:
    paths:
      - "backends/pixeltable/**"
      - "shared/**"
      - ".github/workflows/schema-smoke.yml"
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pixeltable-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backends/pixeltable
    env:
      PIXELTABLE_HOME: ${{ github.workspace }}/.pxt-home
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            backends/pixeltable/uv.lock
            shared/uv.lock
      - name: Install the Pixeltable backend
        run: uv sync --frozen
      - name: Pixeltable satisfies the supported release floor
        run: uv run --frozen python -c "import pixeltable as pxt; from packaging.version import Version; assert Version('0.7.15') <= Version(pxt.__version__) < Version('0.8'), pxt.__version__"
      - name: Exercise the API, computed columns, view, index, and media without model calls
        run: uv run --frozen --with pytest python -m pytest tests/test_api_contract.py -q
      - name: Validate app.py with Pixeltable's own checks
        run: |
          uv run pxt schema check app.py
          uv run pxt service check app.py
      - name: Create the tables from app.py
        run: uv run pxt schema update app.py call_center -f
