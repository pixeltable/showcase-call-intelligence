name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shared-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run --with pytest python -m pytest tests -q

  reference-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backends/reference
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            backends/reference/uv.lock
            shared/uv.lock
      - run: uv sync --frozen
      - run: uv run --frozen --with pytest python -m pytest tests/test_contract.py -q

  results-are-current:
    # The docs quote compare/results/*.json; these fail if a number or chart drifts from its source.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python scripts/metrics.py --check
      - run: python scripts/render_results.py --check
      - run: pip install ruff==0.16.9 pytest httpx && ruff check .
      - run: python -m pytest scripts/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b --pretty false
      - run: npx oxlint
