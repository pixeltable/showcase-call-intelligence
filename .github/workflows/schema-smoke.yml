name: Schema smoke

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pixeltable-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backends/pixeltable
    env:
      PIXELTABLE_HOME: ${{ github.workspace }}/.pxt-home
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            backends/pixeltable/uv.lock
            shared/uv.lock
      - name: Install the Pixeltable backend
        run: uv sync
      - name: Pixeltable is on the 0.7 line
        run: uv run python -c "import pixeltable as pxt; assert pxt.__version__.startswith('0.7.'), pxt.__version__"
      - name: Validate app.py with Pixeltable's own checks
        run: |
          uv run pxt schema check app.py
          uv run pxt service check app.py
      - name: Create the tables from app.py
        run: uv run pxt schema update app.py call_center -f
