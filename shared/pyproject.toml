[project]
name = "call-center-api"
version = "0.1.0"
description = "Shared REST API schemas for call center comparison backends"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["call_center_api"]
