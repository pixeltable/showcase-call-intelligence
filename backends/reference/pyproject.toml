[project]
name = "sample-app-call-intelligence-reference"
version = "0.4.0"
description = "Call intelligence Reference backend (Celery + Postgres + pgvector)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "python-multipart",
    "sqlalchemy>=2.0",
    "psycopg2-binary",
    "alembic",
    "pgvector",
    "celery[redis]",
    "redis",
    "httpx",
    "whisperx",
    "torch",
    "sentence-transformers>=5.4,<6",
    "pydantic-settings",
    "call-center-api",
]

[tool.uv.sources]
call-center-api = { path = "../../shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "worker"]
